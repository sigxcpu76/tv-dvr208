name: Release & Docker Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0) when triggered manually'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write
  packages: write

jobs:
  release-binaries:
    name: Build Multi-Arch Binaries & GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.mod

      - name: Build & test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Run backend tests
        working-directory: backend
        run: go test -race ./...

      - name: Build cross-platform release archives
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          mkdir -p release

          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch <<< "$target"
            bin_name="dvr-gateway"
            if [ "$goos" = "windows" ]; then
              bin_name="dvr-gateway.exe"
            fi

            stage_dir="release/tv-dvr208_${VERSION}_${goos}_${goarch}"
            mkdir -p "$stage_dir"

            echo "Building ${goos}/${goarch}..."
            (
              cd backend
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
                go build -trimpath -ldflags="-s -w" -o "../${stage_dir}/${bin_name}" ./cmd/dvr-gateway
            )

            if [ "$goos" = "windows" ]; then
              (cd release && zip -rq "tv-dvr208_${VERSION}_${goos}_${goarch}.zip" "tv-dvr208_${VERSION}_${goos}_${goarch}")
            else
              tar -C release -czf "release/tv-dvr208_${VERSION}_${goos}_${goarch}.tar.gz" "tv-dvr208_${VERSION}_${goos}_${goarch}"
            fi
            rm -rf "$stage_dir"
          done

          (cd release && sha256sum *.tar.gz *.zip > checksums.txt)
          ls -lh release/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/checksums.txt

  docker-publish:
    name: Build & Push Multi-Arch Docker Image (GHCR)
    runs-on: ubuntu-latest
    needs: release-binaries
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
