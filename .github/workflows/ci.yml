name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build (Frontend + Backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.mod

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Build production frontend into backend/internal/webui/dist
        working-directory: frontend
        run: npm run build

      - name: Run backend go vet & unit tests (including embedded dist verification)
        working-directory: backend
        run: |
          go vet ./...
          go test -race -v ./...

      - name: Build single-binary gateway
        working-directory: backend
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dvr-gateway ./cmd/dvr-gateway

  docker-build:
    name: Verify Docker Image Build
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tv-dvr208:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
